name: Flag exports without a site example

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flag-missing-examples
  cancel-in-progress: false

jobs:
  flag-missing-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout akira-io/ui
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout the site
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: kidiatoliny/ui
          ref: next
          token: ${{ secrets.PAYABLE_DOCS_TOKEN }}
          path: site
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Detect exports without a demo
        id: detect
        run: |
          set -euo pipefail
          MISSING="$(node scripts/detect-missing-examples.mjs . site)"
          case "$MISSING" in
            '['*']') ;;
            *)
              echo "the detector produced no JSON array: $MISSING" >&2
              exit 1
              ;;
          esac
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "$MISSING"

      - name: Report the list on the site issue
        env:
          GH_TOKEN: ${{ secrets.PAYABLE_DOCS_TOKEN }}
          SITE_REPO: kidiatoliny/ui
          ISSUE_TITLE: Exports without a site example
          MISSING: ${{ steps.detect.outputs.missing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/report-missing-examples.sh
