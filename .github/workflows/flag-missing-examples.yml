name: Scaffold stubs for exports without a site example

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flag-missing-examples
  cancel-in-progress: false

jobs:
  flag-missing-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout akira-io/ui
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout the site
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: kidiatoliny/ui
          ref: next
          token: ${{ secrets.PAYABLE_DOCS_TOKEN }}
          path: site
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Scaffold stubs for exports without a demo
        id: detect
        working-directory: site
        run: |
          MISSING="$(node ../scripts/detect-missing-examples.mjs .. .)"
          {
            echo 'missing<<MISSING_EOF'
            echo "$MISSING"
            echo 'MISSING_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "$MISSING"

      - name: Open a PR with the stubs
        if: ${{ steps.detect.outputs.missing != '[]' }}
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.PAYABLE_DOCS_TOKEN }}
          MISSING: ${{ steps.detect.outputs.missing }}
        run: |
          BRANCH="automation/missing-examples"
          PR_STATE="$(gh pr view "$BRANCH" --repo kidiatoliny/ui --json state -q .state 2>/dev/null || true)"

          if [ "$PR_STATE" = "OPEN" ]; then
            echo "PR already open for $BRANCH; leaving it for review instead of rewriting it"
            exit 0
          fi

          git config user.name "kidiatoliny"
          git config user.email "48266788+kidiatoliny@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add src/demos
          if git diff --cached --quiet; then
            echo "stubs already scaffolded"
            exit 0
          fi
          git commit -m "chore(demos): scaffold stubs for components without an example"
          git push --force origin "$BRANCH"

          BODY="akira-io/ui exports these with no matching src/demos folder, so ui.akira-io.com never got a page for them:

          \`\`\`json
          $MISSING
          \`\`\`

          Each stub is a placeholder (TODO comment, no real usage shown). Replace with a real example, then add the catalog row in akira-io/ui's docs. Generated by flag-missing-examples.yml."

          gh pr create --repo kidiatoliny/ui --title "chore(demos): scaffold stubs for missing examples" \
            --body "$BODY" --head "$BRANCH" --base next --assignee @me
