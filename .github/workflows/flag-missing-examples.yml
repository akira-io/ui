name: Flag exports without a site example

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flag-missing-examples
  cancel-in-progress: false

env:
  SITE_REPO: kidiatoliny/ui
  ISSUE_TITLE: Exports without a site example
  MARKER_START: '<!-- missing-examples:start -->'
  MARKER_END: '<!-- missing-examples:end -->'

jobs:
  flag-missing-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout akira-io/ui
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout the site
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: kidiatoliny/ui
          ref: next
          token: ${{ secrets.PAYABLE_DOCS_TOKEN }}
          path: site
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Detect exports without a demo
        id: detect
        run: |
          MISSING="$(node scripts/detect-missing-examples.mjs . site)"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "$MISSING"

      - name: Report the list on the site issue
        env:
          GH_TOKEN: ${{ secrets.PAYABLE_DOCS_TOKEN }}
          MISSING: ${{ steps.detect.outputs.missing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          NUMBER="$(gh issue list --repo "$SITE_REPO" --state open \
            --search "$ISSUE_TITLE in:title" --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')"

          if [ "$MISSING" = '[]' ]; then
            if [ -n "$NUMBER" ]; then
              gh issue comment "$NUMBER" --repo "$SITE_REPO" \
                --body "Every export now has a demo folder or sits in tests/uncovered-entries.json. Run: $RUN_URL"
              gh issue close "$NUMBER" --repo "$SITE_REPO"
            fi
            exit 0
          fi

          LIST="$(printf '%s' "$MISSING" | jq -r '.[] | "- `\(.group)/\(.slug)` from `\(.specifier)`"')"

          BODY="$(printf '%s\n' \
            "These akira-io/ui exports have no folder under src/demos, so the site renders no page for them." \
            "" \
            "$LIST" \
            "" \
            "Entries listed in tests/uncovered-entries.json are deliberately without a demo and never show up here." \
            "" \
            "$MARKER_START" \
            '```json' \
            "$MISSING" \
            '```' \
            "$MARKER_END" \
            "" \
            "Generated by flag-missing-examples.yml in akira-io/ui. Run: $RUN_URL")"

          if [ -z "$NUMBER" ]; then
            gh issue create --repo "$SITE_REPO" \
              --title "$ISSUE_TITLE" \
              --label documentation \
              --assignee kidiatoliny \
              --body "$BODY"
            exit 0
          fi

          RECORDED="$(gh issue view "$NUMBER" --repo "$SITE_REPO" --json body --jq .body \
            | tr -d '\r' \
            | sed -n "/$MARKER_START/,/$MARKER_END/p" \
            | sed '1d;$d' \
            | sed '/^```/d' \
            | tr -d '[:space:]')"

          if [ "$RECORDED" = "$(printf '%s' "$MISSING" | tr -d '[:space:]')" ]; then
            echo "the list has not changed since the issue was last updated"
            exit 0
          fi

          gh issue edit "$NUMBER" --repo "$SITE_REPO" --body "$BODY"
          gh issue comment "$NUMBER" --repo "$SITE_REPO" \
            --body "$(printf '%s\n' "The list changed:" "" "$LIST" "" "Run: $RUN_URL")"
