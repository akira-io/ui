name: Sync docs to the site

on:
  push:
    branches: [main]
    paths: ['docs/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout akira-io/ui
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Checkout the site
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: kidiatoliny/ui
          token: ${{ secrets.SITE_DOCS_TOKEN }}
          path: site

      - name: Mirror the markdown into the site
        run: |
          mkdir -p site/src/content/docs
          rsync -a --delete --include='*.md' --exclude='*' docs/ site/src/content/docs/

      - name: Publish the change
        working-directory: site
        run: |
          git config user.name "kidiatoliny"
          git config user.email "48266788+kidiatoliny@users.noreply.github.com"
          git add src/content/docs
          if git diff --cached --quiet; then
            echo "no docs changes to publish"
            exit 0
          fi
          git commit -m "docs: sync from akira-io/ui ${GITHUB_SHA::7}"
          git push
