name: Fix stale component preview links

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fix-preview-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout akira-io/ui
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.PAYABLE_DOCS_TOKEN }}
          persist-credentials: true

      - name: Checkout the site (read-only)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: kidiatoliny/ui
          ref: next
          token: ${{ secrets.PAYABLE_DOCS_TOKEN }}
          path: site
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Refresh preview links from the live demos
        run: node scripts/fix-preview-links.mjs docs/03-components.md site/src/demos/components

      - name: Open a PR with the refreshed links
        env:
          GH_TOKEN: ${{ secrets.PAYABLE_DOCS_TOKEN }}
        run: |
          if git diff --quiet -- docs/03-components.md; then
            echo "preview links already up to date"
            exit 0
          fi

          git config user.name "kidiatoliny"
          git config user.email "48266788+kidiatoliny@users.noreply.github.com"

          BRANCH="automation/fix-preview-links"
          git checkout -b "$BRANCH"
          git add docs/03-components.md
          git commit -m "docs(components): refresh preview links from the live site"
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json state -q .state >/dev/null 2>&1; then
            echo "PR already open for $BRANCH"
          else
            gh pr create --title "docs(components): refresh preview links" \
              --body "kidiatoliny/ui@next already serves demos for these components; the catalog still listed them as Pending. Generated by fix-preview-links.yml." \
              --head "$BRANCH" --base main --assignee @me
          fi
